SYMBOLS {
    __X816_EDIT_ENTRY__: type = weak, value = $2000;
}
MEMORY {
    ZP:      file = "", start = $0022, size = $0080 - $0022, define = yes;

    # $0400-$07F7, NOT $0400-$07FF. $07F8-$07FF is the hand-off block the
    # kernel's k_edit thunk writes -- the filename pointer, its length and the
    # smoke-request bytes -- at fixed addresses no linker owns, deliberately,
    # so it survives between invocations. Sizing VARMEM to stop below it turns
    # a VARS overflow into a LINK ERROR instead of into an editor that quietly
    # opens whatever the last caller's variables happened to spell.
    VARMEM:  file = "", start = $0400, size = $03F8, define = yes;

    EDIT:    file = %O, start = __X816_EDIT_ENTRY__, size = $10000 - __X816_EDIT_ENTRY__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp, define = yes;
    EXTZP:    load = ZP,     type = zp, optional = yes;
    LOWCODE:  load = EDIT,   type = ro, optional = yes;
    CODE:     load = EDIT,   type = ro;
    CODE2:    load = EDIT,   type = ro;
    RODATA:   load = EDIT,   type = ro, optional = yes;
    DATA:     load = EDIT,   type = rw, optional = yes;
    BSS:      load = EDIT,   type = bss, define = yes, optional = yes;
    VARS:     load = VARMEM, type = bss, define = yes;
    RAMCODE1: load = EDIT,   type = ro, define = yes, optional = yes;
    RAMCODE2: load = EDIT,   type = ro, define = yes, optional = yes;
    RAMCODE3: load = EDIT,   type = ro, define = yes, optional = yes;
}
